<!--
  index.html — Fragmento reservado (actualmente sin uso)
  =======================================================
  Este archivo existe en el directorio src/pages/ pero NO está asociado
  a ninguna ruta en router.js. El punto de entrada real de la SPA es
  el archivo raíz frontend/index.html (que carga main.js).

  La navegación de la aplicación se gestiona exclusivamente mediante
  hashes de URL (#dashboard, #clientes, etc.) definidos en router.js.

  Si en el futuro se necesita una página de inicio/splash, este archivo
  puede usarse como fragmento de esa ruta agregando en router.js:
    inicio: { render: renderInicio, public: true }
  y creando el módulo src/js/pages/inicio.js correspondiente.
-->
